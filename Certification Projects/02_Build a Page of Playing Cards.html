<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Колода игральных карт</title>
    <link rel="stylesheet" href="styles.css" />   <!-- ← теперь styles.css -->
</head>
<body>
    <main id="playing-cards">
        <div class="page-header">
            <h1>♠ Игральные карты ♥</h1>
            <p>классическая колода в минималистичном стиле</p>
        </div>

        <!-- Карта 1: Туз пик -->
        <div class="card">
            <div class="left suit-black">
                <span class="rank">A</span>
                <span class="suit-small">♠</span>
            </div>
            <div class="middle suit-black">
                <span class="suit-mid large">♠</span>
            </div>
            <div class="right suit-black">
                <span class="rank">A</span>
                <span class="suit-small">♠</span>
            </div>
        </div>

        <!-- Карта 2: Король червей -->
        <div class="card">
            <div class="left suit-red">
                <span class="rank">K</span>
                <span class="suit-small">♥</span>
            </div>
            <div class="middle suit-red">
                <span class="suit-mid">♥</span>
                <span class="suit-mid">♥</span>
                <span class="suit-mid">♥</span>
            </div>
            <div class="right suit-red">
                <span class="rank">K</span>
                <span class="suit-small">♥</span>
            </div>
        </div>

        <!-- Карта 3: Дама бубен -->
        <div class="card">
            <div class="left suit-red">
                <span class="rank">Q</span>
                <span class="suit-small">♦</span>
            </div>
            <div class="middle suit-red">
                <span class="suit-mid">♦</span>
                <span class="suit-mid">♦</span>
                <span class="suit-mid">♦</span>
            </div>
            <div class="right suit-red">
                <span class="rank">Q</span>
                <span class="suit-small">♦</span>
            </div>
        </div>

        <!-- Карта 4: Валет треф -->
        <div class="card">
            <div class="left suit-black">
                <span class="rank">J</span>
                <span class="suit-small">♣</span>
            </div>
            <div class="middle suit-black">
                <span class="suit-mid">♣</span>
                <span class="suit-mid">♣</span>
                <span class="suit-mid">♣</span>
            </div>
            <div class="right suit-black">
                <span class="rank">J</span>
                <span class="suit-small">♣</span>
            </div>
        </div>

        <!-- Карта 5: Десятка пик -->
        <div class="card">
            <div class="left suit-black">
                <span class="rank">10</span>
                <span class="suit-small">♠</span>
            </div>
            <div class="middle suit-black">
                <span class="suit-mid">♠</span>
                <span class="suit-mid">♠</span>
                <span class="suit-mid">♠</span>
            </div>
            <div class="right suit-black">
                <span class="rank">10</span>
                <span class="suit-small">♠</span>
            </div>
        </div>

        <!-- Карта 6: Девятка червей -->
        <div class="card">
            <div class="left suit-red">
                <span class="rank">9</span>
                <span class="suit-small">♥</span>
            </div>
            <div class="middle suit-red">
                <span class="suit-mid">♥</span>
                <span class="suit-mid">♥</span>
                <span class="suit-mid">♥</span>
            </div>
            <div class="right suit-red">
                <span class="rank">9</span>
                <span class="suit-small">♥</span>
            </div>
        </div>
    </main>
</body>
</html>
